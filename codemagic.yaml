workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - google_play  # for keystore secrets
    
    scripts:
      - name: Set up Android SDK licenses
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Get Flutter dependencies
        script: flutter pub get
      
      - name: Run Flutter tests
        script: flutter test --machine || true
      
      - name: Build APK
        script: flutter build apk --release --split-per-abi
      
      - name: Build App Bundle for Play Store
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    
    publishing:
      email:
        recipients:
          - corevantaprojects@gmail.com  # CHANGE THIS to your email
