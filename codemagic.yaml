workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Force AGP 8.3.0
        script: |
          cd android
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.3.0"/' settings.gradle.kts
          cd ..
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
